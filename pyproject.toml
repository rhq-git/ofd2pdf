[project]
name = "ofd2pdf"
version = "0.2.0"
description = "Convert OFD (GB/T 33190) documents to PDF using ofd-cli"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "wmc", email = "wmc@example.com" }
]
keywords = ["ofd", "pdf", "converter", "gb33190", "版式文档"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Office/Business",
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
]

[project.urls]
# 发布到自有仓库后请改成实际地址
Homepage = "https://pypi.org/project/ofd2pdf/"
"OFD backend" = "https://github.com/ofd-utility/ofd-utility"

[project.scripts]
ofd2pdf = "ofd2pdf:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ofd2pdf",
    "/hatch_build.py",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]
exclude = [
    "/src/ofd2pdf/bin/ofd-cli",
    "/src/ofd2pdf/bin/ofd-cli.exe",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ofd2pdf"]
# Include gitignored ofd-cli binaries when present (platform wheels only).
artifacts = [
    "src/ofd2pdf/bin/ofd-cli",
    "src/ofd2pdf/bin/ofd-cli.exe",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "pyinstaller>=6.0",
    "twine>=5.0",
]
