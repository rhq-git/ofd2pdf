name: Release

# 推送 v* tag 时：构建平台 wheel / sdist / 独立二进制 → 挂到 GitHub Release → 上传 PyPI
# 网页上先点 Publish 只会看到 Source code；产物要等本工作流全部成功后才会出现
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.2.1），用于补打并上传到该 Release / PyPI"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Sync package version from tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "Skip version sync (ref is not a v* tag: $TAG)"
            exit 0
          fi
          VERSION="${TAG#v}"
          PY=python3
          command -v python3 >/dev/null || PY=python
          "$PY" -c "
          import re
          from pathlib import Path
          version = '${VERSION}'
          p = Path('pyproject.toml')
          p.write_text(re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          i = Path('src/ofd2pdf/__init__.py')
          i.write_text(re.sub(r'__version__ = \".*\"', f'__version__ = \"{version}\"', i.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          print(f'package version -> {version}')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync --group dev

      - name: Build ofd-cli
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_ofd_cli.ps1
          else
            bash scripts/build_ofd_cli.sh
          fi

      - name: Build platform wheel
        shell: bash
        run: |
          export OFD2PDF_REQUIRE_BIN=1
          uv run python -m build --wheel
          mkdir -p dist-out
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            uv pip install auditwheel
            for whl in dist/*.whl; do
              if ! auditwheel repair "$whl" -w dist-out/; then
                cp "$whl" dist-out/
              fi
            done
          else
            cp dist/*.whl dist-out/
          fi
          echo "Built wheels:"
          ls -la dist-out/

      - name: Build standalone binary
        shell: bash
        run: |
          uv run python scripts/build_standalone.py
          mkdir -p dist-out/standalone
          cp -r dist/standalone/* dist-out/standalone/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: dist-out/

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Sync package version from tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "Skip version sync (ref is not a v* tag: $TAG)"
            exit 0
          fi
          VERSION="${TAG#v}"
          PY=python3
          command -v python3 >/dev/null || PY=python
          "$PY" -c "
          import re
          from pathlib import Path
          version = '${VERSION}'
          p = Path('pyproject.toml')
          p.write_text(re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          i = Path('src/ofd2pdf/__init__.py')
          i.write_text(re.sub(r'__version__ = \".*\"', f'__version__ = \"{version}\"', i.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          print(f'package version -> {version}')
          "

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync --group dev

      - name: Build sdist (no bundled binary)
        run: |
          rm -f src/ofd2pdf/bin/ofd-cli src/ofd2pdf/bin/ofd-cli.exe
          uv run python -m build --sdist
          mkdir -p dist-out
          cp dist/*.tar.gz dist-out/

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist-out/

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Prepare upload dir
        run: |
          mkdir -p upload standalone
          find artifacts -name '*.whl' -exec cp {} upload/ \;
          find artifacts -name '*.tar.gz' -exec cp {} upload/ \;
          find artifacts -path '*/standalone/*' -type f -exec cp {} standalone/ \;
          echo "=== wheels / sdist ==="
          ls -la upload
          echo "=== standalone ==="
          ls -la standalone || true
          test -n "$(ls -A upload/*.whl 2>/dev/null)" || (echo "No wheels produced" && exit 1)

      - name: Attach assets to GitHub Release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            upload/*
            standalone/*
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
